services:
  # 1. Microsoft SQL Server 2022+ Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: biplott_sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-Biplot@2026!StrongPass}
      - MSSQL_PID=Developer
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD:-Biplot@2026!StrongPass}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - biplott_network

  # 2. ASP.NET Core 10 Web API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biplott_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=BiplottDb;User Id=sa;Password=${SA_PASSWORD:-Biplot@2026!StrongPass};TrustServerCertificate=True;MultipleActiveResultSets=true;
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - biplott_network

  # 3. Next.js App Router Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: biplott_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      - PORT=3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - biplott_network

networks:
  biplott_network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
